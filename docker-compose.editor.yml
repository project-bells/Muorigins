services:
  mu-editor:
    build:
      context: ./editor
      dockerfile: Dockerfile
    environment:
      EDITOR_ENABLED: ${EDITOR_ENABLED}
      EDITOR_PORT: ${EDITOR_PORT}
      EDITOR_MU_ROOT: /opt/mu
      EDITOR_BACKUP_DIR: /backups
      EDITOR_MAX_BACKUPS: ${EDITOR_MAX_BACKUPS}
      EDITOR_MAX_SNAPSHOTS: ${EDITOR_MAX_SNAPSHOTS}
    volumes:
      # Bind the repository data directly. Named volumes could be initialized
      # first by the editor image (which has no game data), leaving GameServer
      # with empty/stale files and disconnecting clients immediately at login.
      - ./MuServer/Data:/opt/mu/Data:rw
      - ./MuServer/GameServer/DATA:/opt/mu/GameServer/Data:rw
      - mu_editor_backups:/backups
    networks:
      - default
    # Optional: expose API to host for direct testing
    # ports:
    #   - "${EDITOR_PORT:-8090}:8090"

  mu-web:
    environment:
      EDITOR_ENABLED: ${EDITOR_ENABLED}
      EDITOR_API_URL: ${EDITOR_API_URL}
      EDITOR_MAX_SNAPSHOTS: ${EDITOR_MAX_SNAPSHOTS}

  mu-server:
    volumes:
      - ./MuServer/Data:/opt/mu/Data:rw
      - ./MuServer/GameServer/DATA:/opt/mu/GameServer/Data:rw

networks:
  proxy_net:
    external: true

volumes:
  mu_editor_backups:
